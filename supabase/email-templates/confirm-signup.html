<!--
  Supabase → Authentication → Emails → Templates → "Confirm signup" (new users creating an account).
  Subject: Your Stellar code: {{ .Token }}
  Paste everything below this comment into the template body.
-->
<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f5f5f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1c1c1e;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f4;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border:1px solid #e2e2df;border-radius:16px;overflow:hidden;">
            <tr>
              <td style="background:#1e1e21;padding:20px 28px;">
                <span style="font-size:20px;font-weight:700;letter-spacing:-0.02em;color:#f4f4f5;">Stellar</span>
                <span style="font-size:13px;color:#a1a1aa;"> &nbsp;SAT Prep</span>
              </td>
            </tr>
            <tr>
              <td style="padding:28px;">
                <h1 style="margin:0 0 8px;font-size:22px;font-weight:700;letter-spacing:-0.02em;">Welcome to Stellar</h1>
                <p style="margin:0 0 20px;font-size:15px;line-height:1.5;color:#6b6b70;">Type this code on the Stellar page to finish creating your account.</p>
                <div style="margin:0 0 20px;padding:16px;background:#fff1e6;border-radius:12px;text-align:center;font-family:'SFMono-Regular',Menlo,Consolas,monospace;font-size:32px;font-weight:700;letter-spacing:0.35em;color:#c2410c;">{{ .Token }}</div>
                <p style="margin:0 0 12px;font-size:14px;line-height:1.5;color:#6b6b70;">Or confirm with one click (open it in the same browser):</p>
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 20px;background:#ea580c;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;border-radius:12px;">Create my account</a>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#6b6b70;">The code expires soon. If you didn't sign up for Stellar, you can ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
